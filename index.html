function loadPic(f,cb){var img=new Image();img.onload=function(){var m=Math.min(1,900/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*m);cv.height=Math.round(img.height*m);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.9),img.width,img.height)};img.onerror=function(){cb(null)};img.src=URL.createObjectURL(f)}
function fields(W,H,k,tr){return'<div class="r"><label>Stitches wide <input type="number" id="sw" value="'+W+'" min="2" max="120"></label></div><div class="r"><label>Rows tall <input type="number" id="sh" value="'+H+'" min="2" max="300"></label></div><div class="r"><label>Colors <select id="sc"><option>2</option><option>3</option><option>4</option></select></label></div><div class="m">Trim edges (%) to cut off borders or numbers:</div><div class="r"><label>Top <input type="number" id="t0" value="'+tr[0]+'" min="0" max="40"></label><label>Bottom <input type="number" id="t1" value="'+tr[1]+'" min="0" max="40"></label></div><div class="r"><label>Left <input type="number" id="t2" value="'+tr[2]+'" min="0" max="40"></label><label>Right <input type="number" id="t3" value="'+tr[3]+'" min="0" max="40"></label></div>'}
function rd(){return{W:+$("sw").value,H:+$("sh").value,k:+$("sc").value,tr:[0,1,2,3].map(function(i){return Math.max(0,Math.min(40,+$("t"+i).value||0))})}}
function convert(d,o,cb){
  var img=new Image();img.onload=function(){
    var W=o.W,H=o.H,k=o.k,tr=o.tr,cv=document.createElement("canvas");cv.width=img.width;cv.height=img.height;var cx=cv.getContext("2d");cx.drawImage(img,0,0);
    var sx=img.width*tr[2]/100,sy=img.height*tr[0]/100,sw=img.width*(1-(tr[2]+tr[3])/100),sh=img.height*(1-(tr[0]+tr[1])/100),cw=sw/W,ch=sh/H,cells=[];
    for(var r=0;r<H;r++)for(var c=0;c<W;c++){
      var x=Math.floor(sx+c*cw+cw*.3),y=Math.floor(sy+r*ch+ch*.3),w=Math.max(1,Math.floor(cw*.4)),h=Math.max(1,Math.floor(ch*.4));
      var dd=cx.getImageData(x,y,w,h).data,s=[0,0,0],n=0;
      for(var i=0;i<dd.length;i+=4){s[0]+=dd[i];s[1]+=dd[i+1];s[2]+=dd[i+2];n++}
      cells.push([s[0]/n,s[1]/n,s[2]/n]);
    }
    var lum=cells.map(function(c){return c[0]*.3+c[1]*.59+c[2]*.11}),srt=lum.map(function(l,i){return i}).sort(function(a,b){return lum[a]-lum[b]});
    var cen=[];for(var j=0;j<k;j++)cen.push(cells[srt[Math.floor((j+.5)*srt.length/k)]].slice());

      asg=cells.map(function(c){var b=0,bd=1e9;cen.forEach(function(q,qi){var e=(c[0]-q[0])*(c[0]-q[0])+(c[1]-q[1])*(c[1]-q[1])+(c[2]-q[2])*(c[2]-q[2]);if(e<bd){bd=e;b=qi}});return b});
      cen=cen.map(function(q,qi){var s=[0,0,0],n=0;cells.forEach(function(c,ci){if(asg[ci]===qi){s[0]+=c[0];s[1]+=c[1];s[2]+=c[2];n++}});return n?[s[0]/n,s[1]/n,s[2]/n]:q});
    }

function pdfText(f,cb){
  function run(){var L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var fr=new FileReader();fr.onload=function(){

        var out=[],pr=Promise.resolve();
        for(var i=1;i<=doc.numPages;i++)(function(i){pr=pr.then(function(){return doc.getPage(i).then(function(pg){return pg.getTextContent()}).then(function(tc){
          var lines={},ys=[];tc.items.forEach(function(it){var y=Math.round(it.transform[5]/3);if(!(y in lines)){lines[y]=[];ys.push(y)}lines[y].push([it.transform[4],it.str])});
          ys.sort(function(a,b){return b-a}).forEach(function(y){out.push(lines[y].sort(function(a,b){return a[0]-b[0]}).map(function(z){return z[1]}).join(" ").replace(/\s+/g," ").trim())});
        })})})(i);
        pr.then(function(){cb(out.filter(Boolean).join("\n"))}).catch(function(){cb(null)});
      }).catch(function(){cb(null)});
    };fr.readAsArrayBuffer(f)}
  if(window.pdfjsLib)run();else{var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=run;s.onerror=function(){cb(null)};document.head.appendChild(s)}
}
function kind(s){return s[0]==="#"?"h":s[0]===">"?"n":"s"}

function auto(L){
  var lab=/^(round|rnd|row|r)\s*\d+/i,caps=function(l){return l.length<45&&/[A-Z]/.test(l)&&l===l.toUpperCase()};
  var plain=L.filter(function(l){return kind(l)==="s"}),nl=plain.filter(function(l){return lab.test(l)}).length,out=[],seen=false;
  L.forEach(function(l){
    if(kind(l)!=="s"){out.push(l);return}
    if(caps(l)){out.push("#"+l.replace(/:$/,""));return}
    if(nl>=3){
      if(lab.test(l)){out.push(l);seen=true;return}
      if(!seen){out.push(">"+l);return}
      var pv=out.length?out[out.length-1]:"";
      if(kind(pv)==="s"&&(/^[a-z]/.test(l)||/,$/.test(pv))){out[out.length-1]=pv+" "+l;return}
    }

["Half double (hdc)","Yarn over, insert the hook, yarn over and pull up a loop (3 loops). Yarn over and pull through all 3."],
["Double crochet (dc)","Yarn over, insert the hook, yarn over and pull up a loop (3 loops). Yarn over, pull through 2 loops (2 left). Yarn over, pull through the last 2."],
["Treble (tr)","Yarn over twice, insert the hook, yarn over and pull up a loop (4 loops). Yarn over and pull through 2 loops, three times."],
["sc2tog (sc decrease)","Insert the hook in the next stitch, yarn over and pull up a loop. Insert in the following stitch, yarn over and pull up a loop (3 loops). Yarn over and pull through all 3."],
["dc2tog","Start a dc in the next stitch but stop with 2 loops on the hook (yo, insert, yo, pull up, yo and pull through 2). Start a second dc in the next stitch, also stopping with the last step undone (3 loops now). Yarn over and pull through all 3."],
["tr2tog","Yarn over twice, insert the hook, pull up a loop, then [yo, pull through 2] twice (2 loops left). Yarn over twice, insert in the next stitch, pull up a loop, [yo, pull through 2] twice (3 loops left). Yarn over and pull through all 3."],
["How to read a tapestry grid","Each square is one stitch and each color is a yarn color. Row 1 is the bottom row. For right-handed work, odd rows go right to left and even rows go left to right. Chain 1 and turn at the end of every row. The number at the end of each row tells you which row you are on."],
["Changing colors","On the stitch before the change, work it until 2 loops remain, then pull the NEW color through those 2 loops. The new color is then ready for the next stitch."],
["Carrying yarn (tapestry)","Keep the unused color on the back of the project so it never shows on the front. On odd rows (front facing you) hold it behind the work. On even rows (back facing you) hold it on your side of the work. Keep the strand loose and pick up the new color the same way every time."],
["Using this app","Mark: OFF locks the chart so a stray tap can\u2019t move you. Tap Mark to turn it on, then tap a square to mark progress up to it, or tap a row number to finish that row. Undo steps back one stitch."],["Using patterns","Open the Patterns tab, then add a PDF or type or paste your pattern, one row or round per line. Turn Mark ON, then tap \u2713 Next when you finish a line, or tap any line to jump to it. Edit pattern lets you fix or add lines while you work, and your place is kept."]];
  v.innerHTML="<h2>Tips & help</h2>"+T.map(function(t){return"<details><summary>"+t[0]+"</summary><p>"+t[1]+"</p></details>"}).join("");
